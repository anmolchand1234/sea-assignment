version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: wayline-db
    environment:
      POSTGRES_USER: wayline
      POSTGRES_PASSWORD: wayline_password
      POSTGRES_DB: wayline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wayline -d wayline"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wayline-api
    environment:
      - DATABASE_URL=postgresql://wayline:wayline_password@db:5432/wayline
      - SECRET_KEY=wayline-production-super-secret-key-12345
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wayline-web
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  postgres_data:

